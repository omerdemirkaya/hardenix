[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hardenix"
dynamic = ["version"]
description = "Offline security audit and safe, reversible hardening for Debian and Ubuntu servers"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "hardenix contributors" }]
keywords = ["security", "hardening", "audit", "linux", "ubuntu", "debian", "ssh", "server"]
# hardenix deliberately has no third-party runtime dependencies (supply-chain safety).
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/omerdemirkaya/hardenix"
Issues = "https://github.com/omerdemirkaya/hardenix/issues"
Security = "https://github.com/omerdemirkaya/hardenix/blob/main/SECURITY.md"

[project.scripts]
hardenix = "hardenix.cli:main"

[tool.setuptools.dynamic]
version = { attr = "hardenix.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
