name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04"]
    steps:
      - name: Install Python
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-venv openssh-server git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q pytest==8.3.5
          /tmp/venv/bin/pip install -q .
          /tmp/venv/bin/python -m pytest -q
      - name: Audit this container as root (must not crash)
        run: |
          /tmp/venv/bin/hardenix audit --no-sudo --verbose --fail-on critical || true
          /tmp/venv/bin/hardenix audit --json --no-sudo > report.json || true
          /tmp/venv/bin/python - <<'EOF'
          import json, sys
          data = json.load(open("report.json"))
          errors = [f for f in data["findings"] if f["status"] == "error"]
          for f in errors:
              print("ERROR:", f["id"], f["message"])
          sys.exit(1 if errors else 0)
          EOF
      - name: Dry-run fixes
        run: /tmp/venv/bin/hardenix fix --dry-run --no-sudo
