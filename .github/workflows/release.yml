# Publishes to PyPI when a tag like v0.1.0 is pushed.
#
# There is no PyPI password or API token anywhere: PyPI "Trusted Publishing" accepts
# uploads only from this workflow, in this repository, in the "pypi" environment.
# Every release also gets signed provenance (Sigstore), so users can verify that a
# wheel was built here from a specific commit - see SECURITY.md.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # for signing provenance
      attestations: write  # for storing it on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          version=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/hardenix/__init__.py').read()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - name: Test
        run: |
          python -m pip install -q pytest==8.3.5
          python -m pytest -q
      - name: Build
        run: |
          python -m pip install -q build==1.6.1
          python -m build
      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/w && /tmp/w/bin/pip install -q dist/*.whl && /tmp/w/bin/hardenix --version
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hardenix
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        # PEP 740 attestations are generated and uploaded to PyPI automatically.
